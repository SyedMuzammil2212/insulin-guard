name: insulin-management
x-airflow-common: &airflow-common
  build: ../data-engineering
  env_file: ../.env
  environment: &airflow-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__CORE__LOAD_EXAMPLES: 'false'
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/airflow
    AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW_FERNET_KEY}
    AIRFLOW__WEBSERVER__SECRET_KEY: ${JWT_SECRET}
    DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
    MINIO_ENDPOINT: http://minio:9000
    MINIO_ACCESS_KEY: ${MINIO_ROOT_USER}
    MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
    MINIO_BUCKET: insulin-lake
  volumes:
    - ../data-engineering/dags:/opt/airflow/dags:ro
  depends_on:
    postgres:
      condition: service_healthy
    minio:
      condition: service_started
services:
  postgres:
    image: postgres:16-alpine
    env_file: ../.env
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-scripts:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 5s
      retries: 20
    ports: ['127.0.0.1:5432:5432']
  backend:
    build: ../backend
    env_file: ../.env
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
    ports: ['8000:8000']
    depends_on:
      postgres:
        condition: service_healthy
  minio:
    build:
      context: .
      dockerfile: minio.Dockerfile
    command: server /data --console-address ':9001'
    env_file: ../.env
    volumes: ['minio_data:/data']
    ports: ['127.0.0.1:9000:9000', '127.0.0.1:9001:9001']
  airflow-init:
    <<: *airflow-common
    entrypoint: /bin/bash
    command: ['-c', 'airflow db migrate && (airflow users create --username "$${AIRFLOW_ADMIN_USER}" --password "$${AIRFLOW_ADMIN_PASSWORD}" --firstname Local --lastname Admin --role Admin --email admin@example.invalid || airflow users list | grep -F "$${AIRFLOW_ADMIN_USER}")']
  airflow-webserver:
    <<: *airflow-common
    command: webserver
    ports: ['127.0.0.1:8080:8080']
    depends_on:
      airflow-init:
        condition: service_completed_successfully
  airflow-scheduler:
    <<: *airflow-common
    command: scheduler
    depends_on:
      airflow-init:
        condition: service_completed_successfully
volumes:
  postgres_data:
  minio_data:
